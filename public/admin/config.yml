# Producción - conectado con GitHub via Netlify
backend:
  name: git-gateway
  branch: main

# Para desarrollo local, usar test-repo:
# backend:
#   name: test-repo

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "es"

collections:
  - name: "carousel"
    label: "Nosotros - Imágenes de Fondo"
    label_singular: "Imagen"
    folder: "content/carousel"
    create: true
    slug: "slide-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string", hint: "Nombre descriptivo de la imagen (no se muestra en el sitio)" }
      - { label: "Subtítulo", name: "subtitle", widget: "string", required: false, hint: "Descripción opcional (no se muestra en el sitio)" }
      - { label: "Imagen de Fondo", name: "image", widget: "image", hint: "Foto del equipo para la sección Nosotros" }
      - { label: "Orden", name: "order", widget: "number", default: 1, hint: "1 = primero, 2 = segundo, etc." }
      - { label: "Activo", name: "active", widget: "boolean", default: true, hint: "Desactivar para ocultar sin eliminar" }

  - name: "publicaciones"
    label: "Publicaciones"
    label_singular: "Publicación"
    folder: "content/publications"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Autores", name: "authors", widget: "string", hint: "Separar con comas" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime" }
      - { label: "Tipo", name: "type", widget: "select", options: ["Artículo", "Libro", "Capítulo de Libro", "Paper", "Tesis", "Otro"] }
      - { label: "Revista/Editorial", name: "publication", widget: "string", required: false }
      - { label: "Resumen", name: "summary", widget: "text", required: false }
      - { label: "Link/URL", name: "url", widget: "string", required: false, hint: "Link al PDF o página de la publicación" }
      - { label: "DOI", name: "doi", widget: "string", required: false }
      - { label: "Palabras Clave", name: "keywords", widget: "list", required: false }
      - { label: "Imagen de Portada", name: "image", widget: "image", required: false }
      - { label: "Destacada", name: "featured", widget: "boolean", default: false, hint: "Mostrar en la página principal" }
      - { label: "Sub-eje temático", name: "theme", widget: "select", required: false, options: ["Justicia ecológica y derechos de la naturaleza", "Derecho Ambiental", "Extractivismos", "Pueblos Indígenas", "Género y desigualdades territoriales"], hint: "Agrupa la publicación dentro de Investigación > Producciones del equipo" }
      - label: "Traducción al inglés (opcional)"
        name: "en"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en inglés. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Title (English)", name: "title", widget: "string", required: false }
          - { label: "Summary (English)", name: "summary", widget: "text", required: false }
      - label: "Traducción al portugués (opcional)"
        name: "pt"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en portugués. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Título (Português)", name: "title", widget: "string", required: false }
          - { label: "Resumo (Português)", name: "summary", widget: "text", required: false }

  - name: "eventos"
    label: "Eventos"
    label_singular: "Evento"
    folder: "content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Flyer / Imagen", name: "image", widget: "image", required: false }
      - { label: "Descripción", name: "description", widget: "markdown", required: false }
      - { label: "Fecha (opcional, ordena los eventos)", name: "date", widget: "date", required: false }
      - label: "Traducción al inglés (opcional)"
        name: "en"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en inglés. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Title (English)", name: "title", widget: "string", required: false }
          - { label: "Description (English)", name: "description", widget: "markdown", required: false }
      - label: "Traducción al portugués (opcional)"
        name: "pt"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en portugués. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Título (Português)", name: "title", widget: "string", required: false }
          - { label: "Descrição (Português)", name: "description", widget: "markdown", required: false }

  - name: "noticias"
    label: "Noticias"
    label_singular: "Noticia"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Resumen", name: "excerpt", widget: "text" }
      - { label: "Contenido", name: "body", widget: "markdown" }
      - { label: "Imagen", name: "image", widget: "image", required: false }
      - { label: "Autor", name: "author", widget: "string", required: false }
      - label: "Traducción al inglés (opcional)"
        name: "en"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en inglés. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Title (English)", name: "title", widget: "string", required: false }
          - { label: "Summary (English)", name: "excerpt", widget: "text", required: false }
      - label: "Traducción al portugués (opcional)"
        name: "pt"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en portugués. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Título (Português)", name: "title", widget: "string", required: false }
          - { label: "Resumo (Português)", name: "excerpt", widget: "text", required: false }

  - name: "equipo"
    label: "Quiénes Somos - Equipo"
    label_singular: "Miembro del Equipo"
    folder: "content/team"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Categoría", name: "category", widget: "select", options: ["Responsables", "Equipo"], default: "Equipo", hint: "Responsables = personas a cargo; Equipo = resto del equipo" }
      - { label: "Descripción", name: "description", widget: "text", required: false, hint: "Títulos y afiliaciones, ej: Abogada UNL, Becaria Doctoral de CONICET" }
      - { label: "Foto", name: "photo", widget: "image", required: false, hint: "Si se deja vacío, se muestran las iniciales" }
      - { label: "Orden", name: "order", widget: "number", default: 0, hint: "Para ordenar dentro de cada grupo (menor primero)" }
      - label: "Traducción al inglés (opcional)"
        name: "en"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en inglés. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Description (English)", name: "description", widget: "text", required: false }
      - label: "Traducción al portugués (opcional)"
        name: "pt"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en portugués. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Descrição (Português)", name: "description", widget: "text", required: false }

  - name: "proyectos"
    label: "Qué Hacemos - Proyectos de Investigación"
    label_singular: "Proyecto"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Ámbito", name: "scope", widget: "select", options: ["Nacional", "Internacional"], default: "Nacional", hint: "Define en qué grupo aparece el proyecto" }
      - { label: "Período", name: "period", widget: "string", required: false, hint: "Ej: 2025-2027" }
      - { label: "Financiamiento / Resolución", name: "funding", widget: "string", required: false, hint: "Ej: Resolución CS Nro. 829/2024 · Universidad Nacional del Litoral" }
      - { label: "Resumen", name: "summary", widget: "text", required: false }
      - { label: "Imagen", name: "image", widget: "image", required: false }
      - { label: "Orden", name: "order", widget: "number", default: 0, hint: "Para ordenar dentro de cada grupo (menor primero, cronológico)" }
      - label: "Traducción al inglés (opcional)"
        name: "en"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en inglés. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Title (English)", name: "title", widget: "string", required: false }
          - { label: "Summary (English)", name: "summary", widget: "text", required: false }
      - label: "Traducción al portugués (opcional)"
        name: "pt"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en portugués. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Título (Português)", name: "title", widget: "string", required: false }
          - { label: "Resumo (Português)", name: "summary", widget: "text", required: false }

  - name: "seminarios"
    label: "Qué Hacemos - Seminarios"
    label_singular: "Seminario"
    folder: "content/seminars"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Desde (año)", name: "since", widget: "string", required: false, hint: "Ej: 2016. Dejar vacío si no aplica" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Orden", name: "order", widget: "number", default: 0, hint: "Menor primero" }
      - label: "Traducción al inglés (opcional)"
        name: "en"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en inglés. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Description (English)", name: "description", widget: "text", required: false }
      - label: "Traducción al portugués (opcional)"
        name: "pt"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en portugués. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Descrição (Português)", name: "description", widget: "text", required: false }

  - name: "cursos"
    label: "Qué Hacemos - Cursos Virtuales"
    label_singular: "Curso"
    folder: "content/courses"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Dirección académica", name: "director", widget: "string", required: false, hint: "Ej: María Valeria Berros (FCJS-UNL)" }
      - { label: "Carga horaria", name: "hours", widget: "string", required: false, hint: "Ej: 120 horas · 3 meses" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Orden", name: "order", widget: "number", default: 0, hint: "Menor primero" }
      - label: "Traducción al inglés (opcional)"
        name: "en"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en inglés. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Description (English)", name: "description", widget: "text", required: false }
      - label: "Traducción al portugués (opcional)"
        name: "pt"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en portugués. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Descrição (Português)", name: "description", widget: "text", required: false }

  - name: "acampes"
    label: "Acampes (Extensión)"
    label_singular: "Acampe"
    folder: "content/acampes"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Lugar", name: "title", widget: "string", hint: "Localidad del acampe, ej: Monte Vera" }
      - { label: "Año", name: "date", widget: "string", required: false, hint: "Ej: 2024. Se usa para la línea histórica" }
      - { label: "Latitud", name: "lat", widget: "number", value_type: "float", hint: "Ej: -31.6333 (usar Google Maps para obtener coordenadas)" }
      - { label: "Longitud", name: "lng", widget: "number", value_type: "float", hint: "Ej: -60.7 (usar Google Maps para obtener coordenadas)" }
      - { label: "Descripción", name: "description", widget: "text", required: false }
      - label: "Fotos"
        name: "photos"
        widget: "list"
        required: false
        hint: "Se muestran hasta 3 fotos por acampe"
        field: { label: "Foto", name: "photo", widget: "image" }
      - label: "Traducción al inglés (opcional)"
        name: "en"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en inglés. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Title (English)", name: "title", widget: "string", required: false }
          - { label: "Description (English)", name: "description", widget: "text", required: false }
      - label: "Traducción al portugués (opcional)"
        name: "pt"
        widget: "object"
        collapsed: true
        required: false
        hint: "Completar solo si hay versión en portugués. Si se deja vacío, se muestra el español."
        fields:
          - { label: "Título (Português)", name: "title", widget: "string", required: false }
          - { label: "Descrição (Português)", name: "description", widget: "text", required: false }
